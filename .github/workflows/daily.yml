name: Daily blocklist resolution

on:
  schedule:
    # Runs every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Restore DNS cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: dns-cache-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            dns-cache-${{ matrix.shard }}-
            dns-cache-

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Compute lists for this shard
        id: lists
        run: |
          uv run python -c "
          from src.fetch_lists import BLOCKLISTS
          names = sorted(BLOCKLISTS)
          shard = ${{ matrix.shard }}
          total_shards = 4
          selected = [n for i, n in enumerate(names) if i % total_shards == shard]
          print('lists=' + ' '.join(selected))
          " >> "$GITHUB_OUTPUT"

      - name: Resolve blocklists (shard ${{ matrix.shard }})
        run: uv run main.py --date "${{ steps.date.outputs.date }}" --only ${{ steps.lists.outputs.lists }}

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-shard-${{ matrix.shard }}
          path: results/${{ steps.date.outputs.date }}

  commit:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          path: results/${{ steps.date.outputs.date }}
          merge-multiple: true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add resolution results for ${{ steps.date.outputs.date }}"
            git push
          fi

