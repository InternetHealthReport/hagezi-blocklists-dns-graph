name: Daily blocklist resolution

on:
  schedule:
    # Runs every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Restore DNS cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: dns-cache-${{ github.run_id }}
          restore-keys: |
            dns-cache-

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Resolve blocklists
        run: uv run main.py --date "${{ steps.date.outputs.date }}"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add resolution results for ${{ steps.date.outputs.date }}"
            git push
          fi

