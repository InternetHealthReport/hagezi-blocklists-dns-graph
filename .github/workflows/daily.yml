name: Daily blocklist resolution

on:
  schedule:
    # Runs every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compute_lists:
    runs-on: ubuntu-latest
    outputs:
      lists: ${{ steps.lists.outputs.lists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Compute list names as JSON array
        id: lists
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from src.fetch_lists import BLOCKLISTS
          names = sorted(BLOCKLISTS)
          print("lists=" + json.dumps(names))
          PY

  resolve:
    needs: compute_lists
    runs-on: ubuntu-latest
    # Run one runner per blocklist, but execute them sequentially (one at a
    # time) rather than in parallel, to avoid many runners hammering DNS
    # servers concurrently.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        list: ${{ fromJson(needs.compute_lists.outputs.lists) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Resolve blocklist (${{ matrix.list }})
        run: uv run main.py --date "${{ steps.date.outputs.date }}" --only ${{ matrix.list }} --workers 1

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.list }}
          path: results/${{ steps.date.outputs.date }}

  commit:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/${{ steps.date.outputs.date }}
          merge-multiple: true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add resolution results for ${{ steps.date.outputs.date }}"
            git push
          fi

